<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://upload.wikimedia.org https://commons.wikimedia.org; connect-src 'self' https://en.wikipedia.org https://ar.wikipedia.org https://commons.wikimedia.org https://cloudflareinsights.com https://*.cloudflareinsights.com; media-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة — نُزُل</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#062F52">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#062F52;--navy2:#0062A8;--teal:#00C2D1;--sand:#FFB238;--bg:#f3f8fb;--ink:#1d2733;--muted:#5f6b78;--line:#dce7ee}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
  a{color:var(--navy2)}
  header{background:var(--navy);color:#fff}
  .bar{max-width:820px;margin:0 auto;padding:0 18px;height:60px;display:flex;align-items:center;gap:10px}
  .bar a{color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
  .bar svg{width:30px;height:30px}
  main{max-width:820px;margin:28px auto 50px;padding:0 18px}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:26px 24px}
  h1{color:var(--navy);font-size:30px;line-height:1.3}
  .upd{color:var(--muted);font-size:14px;margin:6px 0 18px}
  h2{color:var(--navy2);font-size:20px;margin:22px 0 6px}
  p,li{font-size:16px}
  ul{padding-inline-start:22px}
  .en{margin-top:28px;direction:ltr;text-align:left}
  .en h1{font-size:24px}
  footer{text-align:center;color:var(--muted);font-size:14px;padding:0 18px 30px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a href="/"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="3" y="13" width="26" height="17" rx="3.2" fill="#0062A8"/><path d="M16 2.5 1.5 14.5h29L16 2.5Z" fill="#00C2D1"/><rect x="12.8" y="19.5" width="6.4" height="10.5" rx="1.6" fill="#FFB238"/></svg>نُزُل</a>
  </div>
</header>
<main>
  <div class="card" style="text-align:center;padding:44px 24px">
    <div style="font-size:54px;line-height:1">🧭</div>
    <h1 style="margin-top:10px">الصفحة غير موجودة</h1>
    <p style="color:var(--muted);margin:8px 0 22px">يمكن الرابط قديم أو فيه خطأ. ارجع للرئيسية وابحث عن فندقك من هناك.</p>
    <a href="/" style="display:inline-block;background:var(--sand);color:var(--navy);font-weight:800;text-decoration:none;padding:12px 26px;border-radius:12px">الصفحة الرئيسية</a>
    <p dir="ltr" lang="en" style="color:var(--muted);font-size:14px;margin-top:22px">Page not found. <a href="/">Back to Nuzul home</a></p>
  </div>
</main>
</body>
</html>
